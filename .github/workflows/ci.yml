name: Windows CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for asset tests and icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python image dependency
        run: python -m pip install Pillow

      - name: Install locked Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run TypeScript tests
        run: npm test

      - name: Run image and asset tests
        run: python -m unittest discover -s tests

      - name: Lock release source commit
        run: node scripts/create-release-manifest.mjs --preflight release/ci

      - name: Build application and native probe
        run: npm run build

      - name: Smoke-test native probe protocol
        run: npm run qa:probe

      - name: Generate Windows icon
        run: python scripts/make-icon.py

      - name: Package portable Windows x64 build
        run: npx electron-builder --win portable --x64 --publish never --config.directories.output=release/ci

      - name: Stage Codex pet and wallpaper assets
        run: node scripts/stage-release-assets.mjs release/ci

      - name: Write build provenance manifest
        run: node scripts/create-release-manifest.mjs release/ci

      - name: Write SHA-256 manifest
        run: node scripts/create-checksums.mjs release/ci

      - name: Upload Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawd-windows-${{ github.sha }}
          path: release/ci/
          if-no-files-found: error
          retention-days: 14
